name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Stage 1 - Build
        run: ./mvnw clean install -DskipTests -B

      - name: Stage 2 - Unit Tests
        run: ./mvnw test -B

      - name: Stage 3 - JaCoCo Report
        run: ./mvnw jacoco:report -B

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

      - name: Stage 4 - Checkstyle
        run: ./mvnw checkstyle:check -B

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Stage 5 - PMD
        run: ./mvnw pmd:check -B

      - name: Upload PMD Report
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: target/pmd.xml

      - name: Stage 6 - SpotBugs
        run: ./mvnw spotbugs:check -B

      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
